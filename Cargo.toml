[workspace]
resolver = "2"
members = [
    "crates/tslib-core",
    "crates/tslib-audio",
    "crates/tslib-chat",
    "crates/tslib-channel",
    "crates/tslib-ffi",
    "crates/tslib-python",
    "crates/tslib-jni",
    "crates/tslib-bot",
    "examples/simple-bot",
    "examples/voice-client",
    "examples/test-suite",
    "examples/send-msg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Flamme"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/flamme/tslib"
description = "A modular TeamSpeak 3 client library"
rust-version = "1.75"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TeamSpeak protocol (tsclientlib)
# Pinned: hickory 0.26 (DNS, from 04aa249) crashes on Android during domain
# resolution; 3fbfa26 is the last revision with the working hickory 0.24 stack.
# Our fork (IcaroPablo/tsclientlib, branch telespeak) is 3fbfa26 without the
# server-nickname lookup, and with the message handlers generated in a fixed order.
tsclientlib = { git = "https://github.com/IcaroPablo/tsclientlib.git", rev = "76fc67ad39c3abaa025e9cc815c3be1854537382" }
tsproto = { git = "https://github.com/IcaroPablo/tsclientlib.git", rev = "76fc67ad39c3abaa025e9cc815c3be1854537382" }
tsproto-packets = { git = "https://github.com/IcaroPablo/tsclientlib.git", rev = "76fc67ad39c3abaa025e9cc815c3be1854537382" }
tsproto-types = { git = "https://github.com/IcaroPablo/tsclientlib.git", rev = "76fc67ad39c3abaa025e9cc815c3be1854537382" }

# Audio
opus = "0.3"
cpal = "0.15"
rubato = "0.14"  # Resampling

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# FFI
cbindgen = "0.26"

# Crypto
rand = "0.8"
base64 = "0.21"

[patch.crates-io]
# opus 1.6.1 from the crates/audiopus-sys/opus submodule, built without CMake,
# for both tsclientlib (through audiopus) and the opus crate. audiopus_sys 0.2.2
# bundles an opus snapshot from before 1.4.
audiopus_sys = { path = "crates/audiopus-sys" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
