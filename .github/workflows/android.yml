name: Android native build

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build libtslib_jni.so (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Host unit tests (identity import/export roundtrip etc.) — pure Rust,
      # runs on the ubuntu toolchain before the Android cross-build
      - name: Run tslib-core tests
        run: cargo test -p tslib-core

      # vendored OpenSSL needs perl+make+cmake — all present on ubuntu-latest.
      # Uses the NDK preinstalled on GitHub runners (ANDROID_NDK_HOME is set
      # by the image); the glob fallback covers image layout changes.
      - name: Build
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            ANDROID_NDK_HOME="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          export ANDROID_NDK_HOME
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          echo "Using NDK: $ANDROID_NDK_HOME"
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o dist/jniLibs \
            build --release -p tslib-jni -j4
          ls -lh dist/jniLibs/*/libtslib_jni.so

      - uses: actions/upload-artifact@v4
        with:
          name: tslib-jni-android
          path: dist/jniLibs/*/libtslib_jni.so
          if-no-files-found: error
